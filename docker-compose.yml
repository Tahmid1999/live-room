# Mongo runs as a one-node replica set because Prisma transactions need one.
# The healthcheck initiates the set the first time rs.status() throws.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6383:6379"

  # Audio rooms run on this. Copy livekit.dev.example.yaml to livekit.dev.yaml
  # and fill in the key and secret first. The prometheus port is what the API
  # samples for the measured egress number, so it stays published (loopback only).
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7890:7890"
      - "7891:7891"
      - "51000-51020:51000-51020/udp"
      - "127.0.0.1:6789:6789"

volumes:
  mongo-data:
