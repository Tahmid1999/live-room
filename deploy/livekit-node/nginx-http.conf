# Port 80 for livekit.tahmidalavi.com only: the certificate challenge, and a
# redirect for everything else. Other hostnames keep their own server blocks.
server {
    listen 80;
    listen [::]:80;
    server_name livekit.tahmidalavi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/live-room-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
