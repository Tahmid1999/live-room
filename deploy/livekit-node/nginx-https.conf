
# The name is unique on purpose: a map variable is global to nginx, and the
# box's own sites may already define $connection_upgrade.
map $http_upgrade $live_room_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name livekit.tahmidalavi.com;

    ssl_certificate /etc/letsencrypt/live/livekit.tahmidalavi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.tahmidalavi.com/privkey.pem;

    # Counters only, but nobody else needs them: install.sh fills in the API
    # server's address.
    location = /lr-metrics {
        allow API_SERVER_IP;
        deny all;
        proxy_pass http://127.0.0.1:6790/metrics;
    }

    # Signalling is one long websocket per participant.
    location / {
        proxy_pass http://127.0.0.1:7980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $live_room_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
